<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Quiz Topic</title>

    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Toastr CSS (CDN Version) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    
    <link rel="stylesheet" href="css/Header.css">
    <link rel="stylesheet" href="css/manageQuiz.css">

</head>
<body>

    <!-- Navbar Section -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <div class="logo-section">
                    <img src="Images/Logo.jpeg" alt="HELP University Logo">
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-column" id="navbarNav">
                    <div id="nav-links" class="nav-links ms-auto"></div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="container">
        <h2 id="pageTitle"></h2>

        <!-- Week Selection -->
        <div class="dropdown-container">
            <label for="weekDropdown">Select Week:</label>
            <select id="weekDropdown">
                <option value="" disabled selected>Select a week</option>
            </select>
        </div>

        <!-- Quiz Topic Input -->
        <div id="quizContainer"></div>

        <!-- Save Button -->
        <button id="saveQuizBtn" class="btn-save">Save Quiz</button>

        <!-- Summary Table -->
        <h3>Quiz Topic Summary</h3>
        <table id="quizSummary">
            <thead>
                <tr>
                    <th>Week</th>
                    <th>Quiz Topic</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- JavaScript Files -->
    <script type="module" src="js/Header.js"></script>
    <script src="js/manageQuiz.js"></script>

    <!-- jQuery & Toastr (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
