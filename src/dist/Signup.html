<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="node_modules/toastr/build/toastr.min.css">
  <script type="module" crossorigin src="/assets/signup-CEVe8-AW.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/FirebaseConfig-Cm1xbBeR.js">
  <link rel="modulepreload" crossorigin href="/assets/toastr.min-DBfZ4jHI.js">
  <link rel="stylesheet" crossorigin href="/assets/toastr-DPlFYqzU.css">
  <link rel="stylesheet" crossorigin href="/assets/signup-DqP8siAj.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <img src="/assets/Logo-B6ZKfmVs.jpeg" alt="HELP University Logo">
        </div>
        <div class="form-section">
            <div class="signup-form">
                <h2>Sign Up</h2>
                <form id="signupForm">
                    <input type="text" id="fullName" placeholder="Full Name" required>
                    <input type="text" id="studentId" placeholder="Student ID" required>
                    <select id="department" required>
                        <option value="">-- SELECT --</option>
                        <option value="BIT">Bachelor of Information Technology</option>
                        <option value="BDA">Bachelor of Data Analytics</option>
                        <option value="BCS">Bachelor of Computer Science</option>
                    </select>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="tel" id="phone" placeholder="Phone" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <select id="institution" required>
                        <option value="">-- SELECT --</option>
                        <option value="help_university">HELP University</option>
                        <option value="help_academy">HELP Academy</option>
                    </select>
                    <button type="submit" class="signup-btn">Sign Up</button>
                    <div class="or">Or</div>
                    <a href="index.html" class="login-btn">Login</a>
                </form>
                <a href="ForgotPassword.html" class="forgot-password">Forgot Password?</a>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</body>
</html>
