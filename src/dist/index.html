<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="node_modules/toastr/build/toastr.min.css">
  <script type="module" crossorigin src="/assets/main-tH83OJOz.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/toastr.min-MdK85Wuf.js">
  <link rel="stylesheet" crossorigin href="/assets/toastr-DPlFYqzU.css">
  <link rel="stylesheet" crossorigin href="/assets/main-CrvHu8y8.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <img src="/assets/Logo-B6ZKfmVs.jpeg" alt="HELP University Logo">
        </div>
        <div class="form-section">
            <div class="login-form">
                <h2>Login</h2>
                <form id="loginForm">
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <select id="institution" required>
                        <option value="">-- SELECT --</option>
                        <option value="help_university">HELP University</option>
                        <option value="help_academy">HELP Academy</option>
                    </select>
                    <button type="submit" class="login-btn">Login</button>
                    <div class="or">Or</div>
                    <a href="Signup.html" class="signup-btn">Sign Up</a>
                </form>
                <a href="ForgotPassword.html" class="forgot-password">Forgot Password?</a>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</body>
</html>
