<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Medical Certificate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">  <!-- Linking the CSS --> 
  <script type="module" crossorigin src="/assets/submitMC-6B_tsUou.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/FirebaseConfig-Cm1xbBeR.js">
  <link rel="modulepreload" crossorigin href="/assets/Header-DJ8cievG.js">
  <link rel="stylesheet" crossorigin href="/assets/submitMC-DAtAGijf.css">
  <link rel="stylesheet" crossorigin href="/assets/Header-C7bypHhb.css">
</head>
<body>
    <!-- Navbar Section -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <!-- Logo Section -->
                <div class="logo-section">
                    <img src="/assets/Logo-B6ZKfmVs.jpeg" alt="HELP University Logo">
                </div>
                
                <!-- Hamburger Menu Button for Mobile View -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
    
                <!-- Nav Links Section -->
                <div class="collapse navbar-collapse flex-column" id="navbarNav">
                    <div id="nav-links" class="nav-links ms-auto"></div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Submit Medical Certificate</h1>
        <form id="mcForm">
            <label for="file">Upload Medical Certificate (PDF or Image):</label>
            <input type="file" id="file" required /><br><br>

            <label for="reason">Reason for Sick Leave:</label>
            <textarea id="reason" rows="4" cols="50" placeholder="Enter the reason for your sick leave" required></textarea><br><br>

            <label for="note">Additional Note (Optional):</label>
            <textarea id="note" rows="4" cols="50" placeholder="Enter any additional note here..."></textarea><br><br>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script> <!-- Linking the JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
