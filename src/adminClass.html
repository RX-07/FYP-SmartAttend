<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/toastr/build/toastr.min.css">
    <link rel="stylesheet" href="css/Header.css">
    <link rel="stylesheet" href="css/adminClass.css">
</head>
<body>

    <!-- Navbar Section -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <div class="logo-section">
                    <img src="Images/Logo.jpeg" alt="HELP University Logo">
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-column" id="navbarNav">
                    <div id="nav-links" class="nav-links ms-auto"></div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Container Section -->
    <div class="container mt-4">

        <!-- Filter Section -->
        <div class="filter-section">
            <div>
                <label for="categoryFilter" class="fw-bold">Filter by Category:</label>
                <select id="categoryFilter" class="form-select">
                    <option value="all">All Subjects</option>
                    <option value="BIT">BIT (Bachelor of IT)</option>
                    <option value="BDA">BDA (Big Data Analytics)</option>
                    <option value="BCS">BCS (Cybersecurity)</option>
                </select>
            </div>

            <div>
                <label for="searchInput" class="fw-bold">Search:</label>
                <input type="text" id="searchInput" class="form-control" placeholder="Search by Subject ID or Name">
            </div>
        </div>
    
        <div id="adminSubjects" class="row mt-4 justify-content-center">
            <!-- Subjects will be loaded here dynamically -->
        </div>

        <div id="topic-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3 id="modal-subject-title"></h3> <!-- Dynamically show Subject ID -->
        
                <label for="week-select">Select Week:</label>
                <select id="week-select" class="form-control">
                    <option value="" disabled selected>Choose a week</option>
                    <!-- Weeks will be added dynamically -->
                </select>
        
                <label for="topic-input">Enter Topic:</label>
                <input type="text" id="topic-input" class="form-control" placeholder="Enter quiz topic for this week">
        
                <button id="save-quiz-btn" class="btn btn-primary">Save Topic</button>
        
                <hr>
        
                <h4>Quiz Summary</h4>
                <div id="quiz-summary">
                    <!-- Quiz summary will be added dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script type="module" src="js/Header.js"></script>
    <script type="module" src="js/adminClass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
